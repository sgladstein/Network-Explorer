[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-explorer"
version = "0.1.0"
description = "Home Wi-Fi survey server: collects phone measurements on a floor plan and explains weak spots in an eero mesh."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
network-explorer = "network_explorer.__main__:main"

[tool.setuptools.packages.find]
include = ["network_explorer*"]

[tool.setuptools.package-data]
network_explorer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
